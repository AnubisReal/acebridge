services:
  acebridge:
    image: ${ACEBRIDGE_IMAGE:-ghcr.io/anubisreal/acebridge:latest}
    pull_policy: always
    ports:
      - target: 8080
        published: ${ACEBRIDGE_PORT:-5023}
        protocol: tcp
    volumes:
      - acebridge_data:/data
    environment:
      TZ: ${TZ:-Europe/Madrid}
      ACEBRIDGE_ALLOW_PRIVATE_SOURCES: ${ACEBRIDGE_ALLOW_PRIVATE_SOURCES:-false}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  acebridge_data:
    name: ${ACEBRIDGE_VOLUME:-acebridge_data}
